<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="WordQuest: learn English vocabulary through four game worlds with spaced repetition.">
  <meta name="theme-color" content="#1b1d4b">
  <title>WordQuest</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗡️</text></svg>">
  <!-- Fonts are optional: the game works offline with the fallback stacks in style.css -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:2rem">WordQuest needs JavaScript to run.</p></noscript>

  <!-- core -->
  <script src="js/core/util.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/db.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/vendor/amplify-bundle.js"></script>
  <script src="js/core/cloud.js"></script>
  <script src="js/core/srs.js"></script>
  <script src="js/data/words.js"></script>
  <script src="js/data/dungeon-story.js"></script>
  <script src="js/core/engine.js"></script>
  <script src="js/core/audio.js"></script>

  <!-- ui -->
  <script src="js/ui/kit.js"></script>
  <script src="js/ui/question.js"></script>
  <script src="js/ui/game.js"></script>

  <!-- 3D engine (bundled locally so the game also works offline) -->
  <script src="js/vendor/three.min.js"></script>

  <!-- game modes (order = order on the hub) -->
  <script src="js/modes/dungeon3d.js"></script>
  <script src="js/modes/dungeon.js"></script>
  <script src="js/modes/detective.js"></script>
  <script src="js/modes/cafe.js"></script>
  <script src="js/modes/runner.js"></script>

  <!-- screens -->
  <script src="js/screens/auth.js"></script>
  <script src="js/screens/hub.js"></script>
  <script src="js/screens/profile.js"></script>
  <script src="js/screens/results.js"></script>

  <script src="js/app.js"></script>
</body>
</html>

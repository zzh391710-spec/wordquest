version: 1
backend:
  phases:
    build:
      commands:
        - npm install --cache .npm --prefer-offline --no-audit --no-fund
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - test -f amplify_outputs.json
        - mkdir -p dist
        - cp -r index.html css js amplify_outputs.json dist/
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
